# ------------------------------------------------------------
# SYS.ERROR v2.0 — Configuración nginx de ejemplo
# Cristian Ruiz · Developer
#
# 1. Copia la carpeta error-pages/ al directorio raíz de tu sitio.
# 2. Ajusta las rutas error_page según tu estructura.
# ------------------------------------------------------------

server {
    listen 80;
    listen 443 ssl http2;
    server_name tudominio.com;
    root /var/www/tudominio;

    # ----- Páginas de error personalizadas -----
    error_page 404 /error-pages/404.html;
    error_page 403 /error-pages/403.html;
    error_page 500 /error-pages/500.html;
    error_page 502 /error-pages/502.html;
    error_page 503 /error-pages/503.html;
    error_page 504 /error-pages/504.html;

    # Alternativa: una sola página para toda la familia 5xx
    # error_page 500 502 503 504 /error-pages/500.html;

    # ----- Cacheo y cabeceras -----
    location ^~ /error-pages/ {
        # Sin caché: el usuario siempre ve la página de error fresca
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }

    # No indexar los archivos de error en listados automáticos
    autoindex off;
}
